version: '3.8'

services:
  tfim-simulator:
    build: .
    container_name: tfim-quantum-simulator
    ports:
      - "8888:8888"
    volumes:
      - ./tfim_dynamics_simulator.ipynb:/workspace/tfim_dynamics_simulator.ipynb
      - ./images:/workspace/images
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
